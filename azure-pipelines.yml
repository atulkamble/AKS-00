
trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  webappName: 'mywebapp868'
  webappRG: 'myRG'
  webappPlan: 'ASP-myRG-89aa'
  serviceConnection: 'AzureWebAppServiceConnection2'

steps:
  # Step 1: Create ZIP package
  - task: ArchiveFiles@2
    displayName: 'ZIP Flask Web App'
    inputs:
      rootFolderOrFile: '$(Build.SourcesDirectory)'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
      replaceExistingArchive: true

  # Step 2: Deploy to Azure App Service
  - task: AzureWebApp@1
    displayName: 'Deploy Flask App to Azure Web App'
    inputs:
      azureSubscription: '$(serviceConnection)'
      appType: 'webAppLinux'
      appName: '$(webappName)'
      resourceGroupName: '$(webappRG)'
      package: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
      runtimeStack: 'PYTHON|3.11'
      startUpCommand: 'gunicorn --bind=0.0.0.0:5000 app:app'
