trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: Build ACR Docker Image@0
    inputs:
      azureSubscription: 'Azure-DevOps'
      azureContainerRegistry: 'atulkamble.azurecr.io'
      imageName: 'flaskapp'
      dockerfile: 'app/Dockerfile'
      tags: |
        $(Build.BuildId)

  - task: Push Image to ACR
    inputs:
      azureSubscription: 'Azure-DevOps'
      azureContainerRegistry: 'atulkamble.azurecr.io'
      imageName: 'flaskapp'
      tags: |
        $(Build.BuildId)      

