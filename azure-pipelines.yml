trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'


variables:
  webappName: 'mywebapp868'
  webappRG: 'myRG'  
  webappPlan: 'ASP-myRG-89aa'
  serviceConnection: 'AzureWebAppServiceConnection2'  # Replace with your Azure service connection name


steps: Zip for WebApp
  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: '$(Build.SourcesDirectory)'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
      replaceExistingArchive: true
  
  
steps: 
  - task: AzureWebApp@1
    displayName: 'Deploy Flask App to Azure Web App'
    inputs:
      azureSubscription: '$(serviceConnection)'
      appType: 'webAppLinux'
      appName: '$(webappName)'
      resourceGroupName: '$(webappRG)'
      package: '$(Build.ArtifactStagingDirectory)/**/*.zip'

