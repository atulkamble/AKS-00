
trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  webappName: 'mywebapp868'
  webappRG: 'myRG'
  serviceConnection: 'AzureWebAppServiceConnection2'

steps:
  # Step 1: Configure Python
  - task: UsePythonVersion@0
    displayName: 'Setup Python'
    inputs:
      versionSpec: '3.11'

  # Step 2: Install dependencies
  - script: |
      python -m pip install --upgrade pip
      pip install -r app/requirements.txt
    displayName: 'Install Flask Dependencies'

  # Step 3: ZIP Flask application
  - task: ArchiveFiles@2
    displayName: 'ZIP Flask Web App'
    inputs:
      rootFolderOrFile: '$(Build.SourcesDirectory)/app'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
      replaceExistingArchive: true

  # Step 4: Deploy to Azure App Service
  - task: AzureWebApp@1
    displayName: 'Deploy Flask App to Azure Web App'
    inputs:
      azureSubscription: '$(serviceConnection)'
      appType: 'webAppLinux'
      appName: '$(webappName)'
      resourceGroupName: '$(webappRG)'
      package: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
      runtimeStack: 'PYTHON|3.11'
      startUpCommand: 'gunicorn --bind=0.0.0.0:8000 app:app'
