trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: Docker@2
    displayName: 'Build and push image to ACR'
    inputs:
      command: buildAndPush
      containerRegistry: 'Azure-DevOps'
      repository: 'flaskapp'
      Dockerfile: '$(Build.SourcesDirectory)/app/Dockerfile'
      buildContext: '$(Build.SourcesDirectory)/app'
      tags: 
        - 'latest'
