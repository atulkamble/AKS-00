trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: AzureCLI@2
    displayName: 'Build and push image to ACR'
    inputs:
      azureSubscription: 'Azure-DevOps'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az acr build \
          --registry atulkamble \
          --image flaskapp:$(Build.BuildId) \
          --file app/Dockerfile \
          .
